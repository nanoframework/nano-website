    <text x="600" y="373" text-anchor="middle" fill="#fff" font-size="37" font-weight="700">C#</text>
    <text x="600" y="408" text-anchor="middle" fill="#cfcce6" font-size="18">Tiny runtime</text>

    <rect x="438" y="516" width="324" height="48" rx="24" fill="#29235c" stroke="#4cb48c" stroke-width="1.5"/>
    <text x="600" y="547" text-anchor="middle" fill="#fff" font-size="22" font-weight="600">Human judgment</text>
    <path d="M64 598H1136" stroke="#57517b"/>
    <text x="600" y="640" text-anchor="middle" fill="#cfcce6" font-size="23">Small footprint. Not small standards.</text>
