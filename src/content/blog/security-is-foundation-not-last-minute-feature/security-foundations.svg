<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Security is a foundation, not a last-minute feature</title>
  <desc id="description">A C# microcontroller rests on four security foundations: peer verification, protected keys, update design and failure handling. Support depends on the target; product design and validation remain the developer's responsibility.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#cfcce6" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#181730"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <g font-family="'Open Sans', 'Segoe UI', Arial, sans-serif">
    <rect x="64" y="52" width="36" height="5" rx="2.5" fill="#4cb48c"/>
    <text x="114" y="62" fill="#cfcce6" font-size="20" font-weight="600">.NET nanoFramework</text>
    <text x="1136" y="62" text-anchor="end" fill="#cfcce6" font-size="18">Engineering fundamentals / 04</text>
    <g fill="#fff" font-size="48" font-weight="700" letter-spacing="-1">
      <text x="64" y="130">Security is a foundation,</text>
      <text x="64" y="188">not a last-minute feature.</text>
    </g>
    <text x="66" y="232" fill="#cfcce6" font-size="24">Small devices. Real responsibilities.</text>

    <g stroke="#4cb48c" stroke-width="7" stroke-linecap="round">
      <path d="M489 296H510 M489 322H510 M489 348H510 M489 374H510 M690 296H711 M690 322H711 M690 348H711 M690 374H711"/>
      <path d="M558 254V275 M586 254V275 M614 254V275 M642 254V275"/>
    </g>
    <rect x="510" y="275" width="180" height="120" rx="16" fill="#29235c" stroke="#4cb48c" stroke-width="3"/>
    <rect x="526" y="291" width="148" height="88" rx="8" fill="#181730" stroke="#009086"/>
    <text x="600" y="333" text-anchor="middle" fill="#fff" font-size="35" font-weight="700">C#</text>
    <text x="600" y="363" text-anchor="middle" fill="#cfcce6" font-size="18">Your device</text>
    <path d="M600 395V413" stroke="#4cb48c" stroke-width="3"/>

    <rect x="64" y="413" width="1072" height="12" rx="6" fill="#009086"/>
    <g fill="#29235c" stroke="#57517b" stroke-width="1.5">
      <rect x="64" y="425" width="250" height="104" rx="14"/>
      <rect x="338" y="425" width="250" height="104" rx="14"/>
      <rect x="612" y="425" width="250" height="104" rx="14"/>
      <rect x="886" y="425" width="250" height="104" rx="14"/>
    </g>
    <g text-anchor="middle">
      <g fill="#fff" font-size="23" font-weight="600">
        <text x="189" y="464">Verify the peer</text>
        <text x="463" y="464">Protect keys</text>
        <text x="737" y="464">Design updates</text>
        <text x="1011" y="464">Plan for failure</text>
      </g>
      <g fill="#cfcce6" font-size="18">
        <text x="189" y="498">TLS + certificates</text>
        <text x="463" y="498">Hardware where supported</text>
        <text x="737" y="498">Authenticity + recovery</text>
        <text x="1011" y="498">Application-specific safety</text>
      </g>
    </g>
    <text x="600" y="573" text-anchor="middle" fill="#cfcce6" font-size="20">Verify target support. Design and validate your product.</text>
    <path d="M64 598H1136" stroke="#57517b"/>
    <text x="600" y="640" text-anchor="middle" fill="#cfcce6" font-size="23">Building blocks. Not a security guarantee.</text>
  </g>
</svg>
