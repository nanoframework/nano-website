# Build, check and deploy the site to Azure Static Web Apps.
#
# - Push to main            -> production (nanoframework.net)
# - Pull request to main    -> its own preview URL, posted as a comment on the PR;
#                              removed again when the PR is closed
# - Every day at 05:00 UTC  -> production rebuild, so posts with a future `date:` go live on their day
#
# Setup: create the Static Web App in Azure (Source: Other / GitHub Actions) and add its deployment
# token as the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type and content check
        run: npx astro check

      - name: Build
        run: npm run build

      # Pull requests from forks don't get repository secrets, so they can't deploy a preview.
      # They are still built and checked above.
      - name: Deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          api_location: ''
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''
